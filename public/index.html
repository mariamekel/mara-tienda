<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mara · Especially selected</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700..900,100&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F3EA;--rose:#CF9B9B;--rd:#B27C7E;--rl:#EAD2CD;--ink:#4A3536;--mut:#8A7471;--line:#E4D6C8;--w:#FFFCF7}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:800;color:var(--rd);line-height:1.1}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font:900 34px Fraunces,serif;color:var(--rose);font-variation-settings:'SOFT' 100}
nav{display:flex;gap:18px;font-size:14px}nav a:hover{color:var(--rd)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.hero{padding:70px 0 50px;text-align:center}
.hero h1{font-size:clamp(40px,6vw,76px);color:var(--rose)}
.hero p{color:var(--mut);margin:16px auto 28px;max-width:440px}
.btn{display:inline-block;background:var(--rd);color:#fff;padding:14px 30px;border-radius:2px;font-weight:500;letter-spacing:.03em;border:0}
.btn:hover{background:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 26px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--w);padding:8px 16px;border-radius:20px;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:30px 20px;padding-bottom:80px}
.card{cursor:pointer}
.ph{aspect-ratio:3/4;background:var(--rl);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s}
.card:hover img{transform:scale(1.04)}
.tag{position:absolute;top:10px;left:10px;background:var(--w);font-size:10.5px;letter-spacing:.1em;padding:3px 9px;font-weight:600;z-index:2}
.tag.SALE{background:var(--rd);color:#fff}.tag.BEST{background:var(--ink);color:#fff}
.card h3{font:500 15px 'DM Sans';color:var(--ink);margin-top:12px}
.pr{margin-top:2px;display:flex;gap:10px;align-items:baseline}.pr s{color:var(--mut);font-size:13px}.pr .now{color:var(--rd);font-weight:600}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:50px;padding:40px 0 80px}
.pd .ph{aspect-ratio:4/5}
.pd h1{font-size:clamp(30px,4vw,44px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.sz{min-width:44px;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--w)}.sz.on{background:var(--ink);color:#fff}.sz:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid #0003;padding:0}.dot.on{outline:2px solid var(--ink);outline-offset:2px}
.lbl{font-size:13px;color:var(--mut);margin:18px 0 6px}
.qty{display:inline-flex;border:1px solid var(--line);background:var(--w)}.qty button{width:40px;height:42px;font-size:18px}.qty span{width:44px;display:grid;place-items:center}
.stock{font-size:13px;color:var(--mut);margin-top:10px}
.empty{text-align:center;padding:80px 0;color:var(--mut)}
.back{font-size:13px;color:var(--mut);padding:24px 0 0;display:inline-block}
.back:hover{color:var(--rd)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:3px;display:none;z-index:9}
footer{background:var(--rl);padding:40px 0 28px;margin-top:40px;text-align:center;font-size:13px;color:#6b5855}
@media(max-width:760px){.pd{grid-template-columns:1fr;gap:24px}nav{display:none}.grid{grid-template-columns:1fr 1fr;gap:24px 12px}}
</style>
</head>
<body>
<header class="top">
  <a href="#/" class="logo">Mara</a>
  <nav>
    <a href="#/">Inicio</a>
    <a href="#/catalogo">Colección</a>
    <a href="#/catalogo?cat=vestidos">Vestidos</a>
    <a href="#/catalogo?cat=tops">Tops</a>
    <a href="#/catalogo?cat=pantalones">Pantalones</a>
    <a href="#/catalogo?cat=accesorios">Accesorios</a>
  </nav>
</header>

<main id="app" class="wrap"></main>
<footer><div class="wrap">Mara · Especially selected · © 2026</div></footer>
<div class="toast" id="toast"></div>

<script type="module">
// ===== Configuración de Supabase (clave publicable: segura para la web) =====
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://ivxtyzcpqyzrlaayirlo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_r2Q5PnnFw7jbXVFMqTGS5g_kGP5SeIW';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n).toFixed(2).replace(/\.00$/, '');
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.i); toast.i = setTimeout(() => t.style.display = 'none', 2200); };

// ===== Datos =====
async function loadCategories() {
  const { data, error } = await sb.from('categories').select('slug,name,pos').order('pos');
  if (error) throw error;
  return data;
}

async function loadProducts({ cat = '' } = {}) {
  let q = sb.from('products')
    .select('id,name,cat,price,old_price,tag,descr,pos,images,variants(size,color_key,color_name,color_hex,stock)')
    .eq('published', true)
    .order('pos').order('id', { ascending: false });
  if (cat) q = q.eq('cat', cat);
  const { data, error } = await q;
  if (error) throw error;
  return data;
}

async function loadProduct(id) {
  const { data, error } = await sb.from('products')
    .select('id,name,cat,price,old_price,tag,descr,images,variants(size,color_key,color_name,color_hex,stock)')
    .eq('id', id).eq('published', true).maybeSingle();
  if (error) throw error;
  return data;
}

// ===== Helpers de producto =====
const totalStock = p => (p.variants || []).reduce((a, v) => a + (v.stock || 0), 0);
const imgOf = p => (p.images && p.images[0]) || '';
const placeholder = () => `<div style="width:100%;height:100%;display:grid;place-items:center;color:var(--mut);font-size:13px">Foto próximamente</div>`;

function badge(p) {
  if (totalStock(p) <= 0) return '<span class="tag">AGOTADO</span>';
  if (p.tag) return `<span class="tag ${esc(p.tag)}">${p.tag === 'BEST' ? 'BEST SELLER' : esc(p.tag)}</span>`;
  return '';
}

function priceHTML(p, big) {
  return p.old_price > 0
    ? `<b class="now">${money(p.price)}</b><s>${money(p.old_price)}</s>`
    : `<b>${money(p.price)}</b>`;
}

function card(p) {
  return `<a class="card" href="#/producto/${p.id}">
    <div class="ph">${badge(p)}${imgOf(p) ? `<img src="${esc(imgOf(p))}" alt="${esc(p.name)}" loading="lazy">` : placeholder()}</div>
    <h3>${esc(p.name)}</h3>
    <div class="pr">${priceHTML(p)}</div>
  </a>`;
}

// ===== Vistas =====
async function vistaInicio() {
  const cats = await loadCategories();
  const all = await loadProducts();
  const nuevos = all.filter(p => p.tag === 'NUEVO').slice(0, 4);
  const destacados = all.slice(0, 4);
  app.innerHTML = `
    <section class="hero">
      <h1>Mara</h1>
      <p>Prendas suaves, siluetas limpias y detalles que se notan. Una colección elegida pieza a pieza.</p>
      <a class="btn" href="#/catalogo">Descubrir colección</a>
    </section>
    <h2 style="margin:30px 0 20px">Categorías</h2>
    <div class="bar">${cats.map(c => `<a class="chip" href="#/catalogo?cat=${esc(c.slug)}">${esc(c.name)}</a>`).join('')}</div>
    ${nuevos.length ? `<h2 style="margin:40px 0 20px">Recién llegadas</h2><div class="grid">${nuevos.map(card).join('')}</div>` : ''}
    ${!nuevos.length && destacados.length ? `<h2 style="margin:40px 0 20px">Colección</h2><div class="grid">${destacados.map(card).join('')}</div>` : ''}
    ${!all.length ? `<div class="empty"><p>Pronto, nueva colección.</p></div>` : ''}`;
}

async function vistaCatalogo(params) {
  const cat = params.get('cat') || '';
  const cats = await loadCategories();
  const products = await loadProducts({ cat });
  const current = cats.find(c => c.slug === cat);
  app.innerHTML = `
    <h1 style="margin:40px 0 8px">${current ? esc(current.name) : 'Colección'}</h1>
    <div class="bar">
      <a class="chip ${!cat ? 'on' : ''}" href="#/catalogo">Todo</a>
      ${cats.map(c => `<a class="chip ${c.slug === cat ? 'on' : ''}" href="#/catalogo?cat=${esc(c.slug)}">${esc(c.name)}</a>`).join('')}
    </div>
    ${products.length ? `<div class="grid">${products.map(card).join('')}</div>` : `<div class="empty"><p>No hay prendas en esta categoría todavía.</p></div>`}`;
}

async function vistaProducto(id) {
  const p = await loadProduct(id);
  if (!p) { app.innerHTML = `<div class="empty"><p>Esta prenda no está disponible.</p><a class="back" href="#/catalogo">← Volver a la colección</a></div>`; return; }

  const colors = [...new Map((p.variants || []).map(v => [v.color_key, { k: v.color_key, n: v.color_name, h: v.color_hex }])).values()];
  const sizes = [...new Set((p.variants || []).map(v => v.size))];
  const state = { color: colors[0]?.k || '', size: '' };
  const stockOf = (size, color) => (p.variants || []).find(v => v.size === size && v.color_key === color)?.stock || 0;

  app.innerHTML = `
    <a class="back" href="#/catalogo">← Volver a la colección</a>
    <div class="pd">
      <div class="ph">${badge(p)}${imgOf(p) ? `<img src="${esc(imgOf(p))}" alt="${esc(p.name)}">` : placeholder()}</div>
      <div>
        <h1>${esc(p.name)}</h1>
        <div class="pr" style="font-size:22px;margin:12px 0 18px">${priceHTML(p)}</div>
        <p style="color:#6b5855;max-width:460px">${esc(p.descr)}</p>

        <div class="lbl">Color: <b id="colorName" style="color:var(--ink)">${esc(colors[0]?.n || '—')}</b></div>
        <div class="chips" id="colors">${colors.map((c, i) => `<button class="dot ${i === 0 ? 'on' : ''}" style="background:${esc(c.h)}" data-k="${esc(c.k)}" data-n="${esc(c.n)}" aria-label="${esc(c.n)}"></button>`).join('')}</div>

        <div class="lbl">Talla</div>
        <div class="chips" id="sizes">${sizes.map(z => `<button class="sz" data-z="${esc(z)}">${esc(z)}</button>`).join('')}</div>
        <div class="stock" id="stockMsg">Elige una talla para ver disponibilidad.</div>

        <div class="lbl">Cantidad</div>
        <div class="qty"><button id="minus">−</button><span id="qty">1</span><button id="plus">+</button></div>

        <div style="margin-top:26px"><button class="btn" id="addBtn" disabled style="opacity:.5">Agregar al carrito</button></div>
      </div>
    </div>`;

  const refresh = () => {
    document.querySelectorAll('#sizes .sz').forEach(b => {
      b.disabled = stockOf(b.dataset.z, state.color) <= 0;
      b.classList.toggle('on', b.dataset.z === state.size);
    });
    const msg = document.getElementById('stockMsg');
    const btn = document.getElementById('addBtn');
    if (!state.size) { msg.textContent = 'Elige una talla para ver disponibilidad.'; btn.disabled = true; btn.style.opacity = .5; return; }
    const s = stockOf(state.size, state.color);
    msg.textContent = s > 0 ? (s <= 3 ? `Solo quedan ${s} unidades` : 'Disponible') : 'Agotado en esta combinación';
    btn.disabled = s <= 0; btn.style.opacity = s > 0 ? 1 : .5;
  };

  document.querySelectorAll('#colors .dot').forEach(b => b.onclick = () => {
    state.color = b.dataset.k;
    document.querySelectorAll('#colors .dot').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('colorName').textContent = b.dataset.n;
    refresh();
  });
  document.querySelectorAll('#sizes .sz').forEach(b => b.onclick = () => { state.size = b.dataset.z; refresh(); });

  let qty = 1;
  const qEl = document.getElementById('qty');
  document.getElementById('minus').onclick = () => { qty = Math.max(1, qty - 1); qEl.textContent = qty; };
  document.getElementById('plus').onclick = () => {
    const max = state.size ? stockOf(state.size, state.color) : 1;
    qty = Math.min(Math.max(1, max), qty + 1); qEl.textContent = qty;
  };

  // El carrito se completa en la siguiente parte.
  document.getElementById('addBtn').onclick = () => {
    if (!state.size) return toast('Elige una talla');
    toast('Carrito disponible en la siguiente parte');
  };

  refresh();
}

// ===== Router =====
async function route() {
  const [path, query] = (location.hash.slice(1) || '/').split('?');
  const params = new URLSearchParams(query || '');
  app.innerHTML = '<div class="empty">Cargando…</div>';
  try {
    if (path === '/' || path === '') await vistaInicio();
    else if (path === '/catalogo') await vistaCatalogo(params);
    else if (path.startsWith('/producto/')) await vistaProducto(path.split('/')[2]);
    else app.innerHTML = '<div class="empty"><p>Página no encontrada.</p></div>';
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="empty"><p>No pudimos cargar la tienda. Inténtalo de nuevo en unos minutos.</p></div>`;
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mara · Administración</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F3EA;--rose:#CF9B9B;--rd:#B27C7E;--rl:#EAD2CD;--ink:#4A3536;--mut:#8A7471;--line:#E4D6C8;--w:#FFFCF7;--bad:#B5483C}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif;padding-bottom:40px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;color:var(--rd);font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--w);position:sticky;top:0;z-index:5}
.logo{font:800 26px Fraunces,serif;color:var(--rose)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.btn{background:var(--rd);color:#fff;border:0;padding:12px 18px;border-radius:3px;font-weight:500;min-height:44px}
.btn.o{background:none;border:1px solid var(--ink);color:var(--ink)}
.btn.s{padding:7px 12px;min-height:36px;font-size:13px}
.link{background:none;border:0;color:var(--rd);text-decoration:underline;padding:6px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--w);padding:11px 12px;border-radius:3px;min-height:44px}
label{display:grid;gap:4px;font-size:13px;color:var(--mut);margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.k{background:var(--w);padding:14px;border:1px solid var(--line)}
.k b{display:block;font:800 26px Fraunces,serif;color:var(--rd)}
.k span{font-size:12.5px;color:var(--mut)}
.box{background:var(--w);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;background:var(--w);border:1px solid var(--line);padding:10px;margin-bottom:8px}
.row .th{width:52px;height:66px;background:var(--rl);flex:none;object-fit:cover}
.row .in{flex:1;min-width:0}
.row .in b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut)}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--rl)}
.pill.g{background:#dfe8d6}.pill.r{background:#f2c9c4}
.b
